name: Docker Publish

on:
  push:
    branches: [main]
    paths-ignore:
      - "README.md"
      - ".planning/**"
  pull_request:
    branches: [main]
    paths-ignore:
      - "README.md"
      - ".planning/**"

# Least-privilege default; jobs opt into more as needed.
permissions:
  contents: read

# Cancels an in-flight run for the same ref when a newer commit lands, so
# back-to-back pushes to main never race on which build finishes last and
# gets tagged :latest.
concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          # Must match the pnpm version pinned in the Dockerfile's builder
          # stage (corepack prepare pnpm@11.17.0) — keep both in sync.
          version: 11.17.0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build (includes typecheck via tsc in each package's build script)
        run: pnpm -r build

      - name: Test
        run: pnpm -r test

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          # Pull requests (including from forks) build the image to catch a
          # broken Dockerfile before merge, but never push — only a push to
          # main publishes.
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ghcr.io/icariumtech/my-bar:latest
